[project]
name = "repo-pulse"
version = "0.1.0.dev0"
description = "Read-only Git history analyzer: hotspots, bus factor, commit quality"
readme = "README.md"
license = "MIT"                      # SPDX string [VERIFY backend support]
authors = [
    { name = "Salim", email = "chouai.salim1994@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.29.0",
]

[project.scripts]
repo-pulse = "repo_pulse.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
