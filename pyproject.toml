[project]
name = "repo-pulse"
version = "0.1.0.dev0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Salim", email = "chouai.salim1994@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.29.0",
]

[project.scripts]
repo-pulse = "repo_pulse.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
